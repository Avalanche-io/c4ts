name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # The Go reference CLI for the cross-implementation comparison in
      # packages/node/tests/scanner.test.ts. Pinned to c4 master 5ee54b6
      # (2026-11-13), so moving it is a deliberate bump.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/Avalanche-io/c4/cmd/c4@5ee54b6
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:json
      # Every skip is listed, and one scripts/allowed-skips.txt does not
      # name for this OS fails the job.
      - run: pnpm skips
        if: ${{ !cancelled() }}
